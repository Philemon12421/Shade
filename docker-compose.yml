version: '3.9'
services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bloom
      POSTGRES_PASSWORD: bloom123
      POSTGRES_DB: bloom_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  user-service:
    build: ./bloom-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bloom_db
      SPRING_DATASOURCE_USERNAME: bloom
      SPRING_DATASOURCE_PASSWORD: bloom123
      SERVER_PORT: 8081
    depends_on:
      - postgres

  tracking-service:
    build: ./bloom-tracking-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bloom_db
      SPRING_DATASOURCE_USERNAME: bloom
      SPRING_DATASOURCE_PASSWORD: bloom123
      SERVER_PORT: 8082
    depends_on:
      - postgres

  community-service:
    build: ./bloom-community-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bloom_db
      SPRING_DATASOURCE_USERNAME: bloom
      SPRING_DATASOURCE_PASSWORD: bloom123
      SERVER_PORT: 8083
    depends_on:
      - postgres

  notification-service:
    build: ./bloom-notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bloom_db
      SPRING_DATASOURCE_USERNAME: bloom
      SPRING_DATASOURCE_PASSWORD: bloom123
      SERVER_PORT: 8084
    depends_on:
      - postgres

volumes:
  pgdata: